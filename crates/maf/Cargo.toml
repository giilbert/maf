[package]
name = "maf"
version = "0.1.0-alpha.3"
edition = "2021"

license = "MIT"
description = "MAF is an authoritative realtime framework for writing simple, secure, and scalable apps."
homepage = "https://maf.gilbertz.me"
repository = "https://github.com/giilbert/maf"
readme = "../../README.md"
include = ["src", "wit"]

[dependencies]
anyhow = "^1.0.96"
futures-util = "0.3.31"
serde = { version = "^1", features = ["derive"] }
serde_json = { version = "^1", default-features = false, features = ["alloc"] }
thiserror = "2"
tokio = { version = "1.44.2", default-features = false, features = ["sync"] }
uuid = { version = "1.16.0", features = ["serde", "v4"] }
maf_schemas = { version = "0.1.0-alpha.3", path = "../maf_schemas" }
schemars = { version = "1.0.4", optional = true }
url = "2.5.4"
http = "1.3.1"

# [target."wasm32-wasip2".dependencies]
wit-bindgen = "0.40.0"
wasi = "0.14.2"
ouroboros = "0.18.5"

[features]
typed = ["dep:schemars"]
native = []
