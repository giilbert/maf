name = "example-platform"
rooms = "AuthenticatedApiRequest"

[auth]
mode = "Jwt"

[debug]
command = "cargo build --target wasm32-wasip2"
output = "target/wasm32-wasip2/debug/example_platform.wasm"

[release]
command = "cargo build --target wasm32-wasip2 --release"
output = "target/wasm32-wasip2/release/example_platform.wasm"
