[package]
name = "maf_container"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "^1.0.96"
axum = { version = "0.8.1", features = ["ws"] }
bytes = "1.10.1"
futures-util = "0.3.31"
serde = "^1"
serde_json = "1.0.140"
tokio = { version = "1.43.0", features = ["full"] }
tokio-tungstenite = "0.26.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
uuid = { version = "1.16.0", features = ["serde", "v4"] }
wasmtime = { version = "30.0.2", features = ["async"] }
wasmtime-wasi = "30.0.2"
wasmtime-wasi-io = "30.0.2"
