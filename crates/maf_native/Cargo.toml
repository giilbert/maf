[package]
name = "maf_native"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "^1.0.96"
axum = { version = "0.8.3", features = ["macros", "ws"] }
maf = { version = "0.1.0-alpha.2", path = "../maf", features = ["native"] }
maf_schemas = { version = "0.1.0-alpha.2", path = "../maf_schemas", features = [
    "error-response",
] }
serde_json = "1.0.140"
tokio = { version = "1.43.0", features = ["full"] }
tracing = "0.1.41"
futures-util = { version = "0.3.31", features = ["sink"] }
