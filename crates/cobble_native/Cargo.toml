[package]
name = "cobble_native"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "^1.0.96"
axum = { version = "0.8.3", features = ["macros", "ws"] }
cobble = { version = "0.1.0-alpha.2", path = "../cobble", features = [
    "native",
] }
cobble_schemas = { version = "0.1.0-alpha.2", path = "../cobble_schemas", features = [
    "error-response",
] }
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["full"] }
tracing = "0.1.41"
futures-util = { version = "0.3.31", features = ["sink"] }
