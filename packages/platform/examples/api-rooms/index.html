<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>api rooms example</title>

    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        display: flex;
        gap: 1rem;
        height: 100vh;
      }

      #ui,
      #room-list {
        margin: 0;
        white-space: pre-wrap;
        font-size: 1.3rem;
      }

      #left {
        flex: 1;
        height: 100%;
        padding-right: 2rem;
        border-right: 1px solid #ccc;
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      #buttons {
        display: flex;
        gap: 1rem;
        align-items: center;
      }

      #join-room-form {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }

      button {
        font-size: 1.2rem;
        padding: 0.5rem 1.5rem;
        cursor: pointer;
      }

      input {
        font-size: 1.2rem;
        padding: 0.5rem;
      }

      main {
        display: flex;
        gap: 2rem;
        padding: 2rem;
      }

      #right {
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="left">
        <div id="buttons">
          <button id="start-room">start a room</button>

          <span>or</span>

          <form id="join-room-form">
            <input type="text" placeholder="room id" id="join-room-id" />
            <button type="submit" id="join-room">join a room</button>
          </form>
        </div>

        <pre id="room-list"></pre>
      </div>

      <div id="right">
        <pre id="ui"></pre>

        <button id="increment-counter">INCREMENT COUNTER!</button>
      </div>
    </main>

    <script type="module" src="src/index.ts"></script>
  </body>
</html>
