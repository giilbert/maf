app = "maf-platform-host"

[[vm]]
memory = "1GB"
cpus = 2

[env]
RUST_LOG = "maf_platform_host=info"
AUTO_SHUTDOWN_TIMEOUT = "60"

[build]
dockerfile = "./fly.dockerfile"

[mounts]
source = "bundles"
destination = "/app/bundle"

[http_service]
internal_port = 1147
auto_start_machines = true
min_machines_running = 0

[http_service.concurrency]
type = "connections"
hard_limit = 5_000
soft_limit = 1_000
